name: api

on:
  pull_request:
    # supabase/** too: a migration is exercised by the api's real-Postgres tests.
    paths: ["apps/api/**", "supabase/**", ".github/workflows/api.yml", ".github/scripts/**"]
  push:
    branches: [main]
    paths: ["apps/api/**", "supabase/**", ".github/workflows/api.yml", ".github/scripts/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      # The same major version as the local test setup. The tests in apps/api/tests/db create and
      # drop their own scratch databases on this server and apply supabase/migrations to each.
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run pytest -ra --junitxml=junit.xml
      # TEST_DATABASE_URL is set, so a skipped real-Postgres test means the setup is broken.
      # pytest would still be green; this fails the job instead.
      - name: The real-Postgres tests must have run
        run: python3 ../../.github/scripts/check_db_tests_ran.py junit.xml tests/db
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-junit
          path: apps/api/junit.xml
