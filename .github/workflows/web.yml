name: web

on:
  # No `paths` filter on pull requests: `build` is a required check on main and develop, and a
  # required check that never runs would block the PR ("Expected: waiting") instead of passing.
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    paths: ["apps/web/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # Version comes from apps/web's `packageManager` field so CI and
          # local installs use the same pnpm (and lockfile format).
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
